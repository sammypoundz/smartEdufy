<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/smart-edufy-icon.png" />
    <link rel="apple-touch-icon" href="/smart-edufy-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartEdufy - AI powered school management system</title>
  </head>
  <body>
    <div id="root"></div>
    <style>
      #web-preloader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#ffffff;}html.dark #web-preloader,body.dark #web-preloader{background:#111827;}
      .web-preloader-inner{display:flex;flex-direction:column;align-items:center;gap:18px;}
      .web-preloader-logo{width:150px;height:auto;object-fit:contain;}
      .web-preloader-tagline{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;color:#475569;letter-spacing:0.02em;}html.dark .web-preloader-tagline,body.dark .web-preloader-tagline{color:#94a3b8;}
      .web-preloader-spinner{display:flex;gap:6px;}
      .web-preloader-spinner>div{width:10px;height:10px;border-radius:50%;background:#2563eb;animation:plBounce 1.1s infinite ease-in-out both;}
      .web-preloader-spinner>div:nth-child(1){animation-delay:-0.32s}.web-preloader-spinner>div:nth-child(2){animation-delay:-0.16s}.web-preloader-spinner>div:nth-child(3){animation-delay:0s}.web-preloader-spinner>div:nth-child(4){animation-delay:0.16s}
      @keyframes plBounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
      #web-preloader.pl-done{opacity:0;transition:opacity .35s ease;pointer-events:none;}
      #web-preloader .pl-error{display:none;font-family:system-ui,sans-serif;font-size:14px;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:8px;}
      #web-preloader.pl-stuck .pl-error{display:block;}
      #web-preloader.pl-stuck .web-preloader-spinner{display:none;}
    </style>
    <div id="web-preloader">
      <div class="web-preloader-inner">
        <img class="web-preloader-logo" src="/smart-edufy-icon.png" alt="SmartEdufy" />
        <div class="web-preloader-tagline">AI Powered Education Ecosystem</div>
        <div class="web-preloader-spinner"><div></div><div></div><div></div><div></div></div>
        <div class="pl-error" onclick="location.reload(true)">Loading failed — tap to retry</div>
      </div>
    </div>
    <script>
      // If the JS bundle never shows up (stale service worker, failed fetch),
      // stop spinning forever and offer a reload.
      setTimeout(function(){
        var p=document.getElementById('web-preloader');
        if(p&&!p.classList.contains('pl-done'))p.classList.add('pl-stuck');
      },12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
